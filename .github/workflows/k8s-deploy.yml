name: CI/CD Pipeline - Confeet Website

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: production-deployment
    cancel-in-progress: false

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: bottomhalf/btc-web-conference
    HELM_RELEASE: btc-web-conference
    HELM_CHART_PATH: ./k8s
    NAMESPACE: cf
    DEPLOYMENT_NAME: btc-web-conference

jobs:
    ci:
        name: Build & Publish Nginx Image
        runs-on: ubuntu-latest
        outputs:
            image_tag: ${{ steps.meta.outputs.sha_tag }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate metadata and tags
              id: meta
              run: |
                  SHA_TAG="${{ github.sha }}"
                  echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
                  echo "Primary image tag: ${SHA_TAG}"

            - name: Build and push container image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    cd:
        name: Deploy to MicroK8s via Helm Template
        needs: ci
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Helm
              uses: azure/setup-helm@v4

            - name: Lint Helm Chart
              run: |
                  echo "==> Linting Helm chart..."
                  helm lint "${{ env.HELM_CHART_PATH }}" \
                    --values "${{ env.HELM_CHART_PATH }}/values.yaml" \
                    --values "${{ env.HELM_CHART_PATH }}/values-production.yaml"

            - name: Setup SSH credentials
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh

                  # Install SSH private key preserving exact format and remove CRLF
                  cat << 'EOF' > ~/.ssh/id_rsa
                  ${{ secrets.SSH_PRIVATE_KEY }}
                  EOF
                  sed -i 's/\r$//' ~/.ssh/id_rsa
                  sed -i -e '$a\' ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa

                  if [ ! -s ~/.ssh/id_rsa ]; then
                    echo "::error::SSH_PRIVATE_KEY secret is not set or empty!"
                    exit 1
                  fi

                  # Validate key syntax
                  ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub 2>/dev/null || true
                  chmod 644 ~/.ssh/id_rsa.pub 2>/dev/null || true

            - name: Deploy Helm Manifests and Verify Rollout
              env:
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_USER: ${{ secrets.SSH_USER }}
                  SSH_PORT: ${{ secrets.SSH_PORT }}
                  IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  IMAGE_TAG: ${{ needs.ci.outputs.image_tag }}
              run: |
                  set -e
                  PORT="${SSH_PORT:-22}"

                  if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
                    echo "::error::SSH_HOST or SSH_USER secrets are not set!"
                    exit 1
                  fi

                  SSH_CMD="ssh -p $PORT -i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=15 ${SSH_USER}@${SSH_HOST}"

                  echo "==> Ensuring namespace ${{ env.NAMESPACE }} exists..."
                  $SSH_CMD "export PATH=\$PATH:/snap/bin; microk8s kubectl get namespace ${{ env.NAMESPACE }} >/dev/null 2>&1 || microk8s kubectl create namespace ${{ env.NAMESPACE }}"

                  echo "==> Rendering Helm template locally on runner with image ${IMAGE_REPO}:${IMAGE_TAG}..."
                  helm template "${{ env.HELM_RELEASE }}" "${{ env.HELM_CHART_PATH }}" \
                    --namespace "${{ env.NAMESPACE }}" \
                    --values "${{ env.HELM_CHART_PATH }}/values.yaml" \
                    --values "${{ env.HELM_CHART_PATH }}/values-production.yaml" \
                    --set image.repository="${IMAGE_REPO}" \
                    --set image.tag="${IMAGE_TAG}" > manifest.yaml

                  if [ ! -s manifest.yaml ]; then
                    echo "::error::Rendered manifest.yaml is empty! Verify that ${{ env.HELM_CHART_PATH }}/templates/ exists and contains templates."
                    exit 1
                  fi

                  echo "==> Applying rendered manifests via SSH stdin (zero files copied to remote host)..."
                  $SSH_CMD "export PATH=\$PATH:/snap/bin; microk8s kubectl apply --namespace ${{ env.NAMESPACE }} -f -" < manifest.yaml

                  echo "==> Verifying Deployment rollout status..."
                  $SSH_CMD "export PATH=\$PATH:/snap/bin; microk8s kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --timeout=180s"

                  echo "==> Deployment successful! Active Pods:"
                  $SSH_CMD "export PATH=\$PATH:/snap/bin; microk8s kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=${{ env.DEPLOYMENT_NAME }} -o wide"

                  echo "==> Service Status:"
                  $SSH_CMD "export PATH=\$PATH:/snap/bin; microk8s kubectl get svc -n ${{ env.NAMESPACE }}"

                  rm -f manifest.yaml

            - name: Cleanup SSH credentials
              if: always()
              run: |
                  echo "Cleaning up SSH credentials"
                  rm -rf ~/.ssh
